<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>GraphHopper - missing OSM bridge tags</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.3.1/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@10.3.1/dist/ol.js"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div id="map"></div>

<div id="panel">
    <h1>missing OSM tags</h1>
    <label><input type="checkbox" data-type="missing_maxheight" checked><span class="dot maxheight"></span> max_height below bridge</label>
    <label><input type="checkbox" data-type="missing_maxweight" checked><span class="dot maxweight"></span> max_weight on bridge</label>
    <label><input type="checkbox" data-type="missing_bridge" checked><span class="dot bridge"></span> bridge tag (crossing ways)</label>
    <div id="status">move the map to load issues</div>
</div>

<div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer">&times;</a>
    <div id="popup-content"></div>
</div>

<script src="index.js"></script>
</body>
</html>
